name: _docker-build

on:
  workflow_call:
    inputs:
      environment: # qa | testnet | mainnet, or empty for a PR build without build-time defaults
        type: string
        required: false
        default: ''
      image_tag: # "qa" | "testnet" | "mainnet" | ignored if release_tag set
        type: string
        required: true
      release_tag: # e.g. v1.2.3 (optional). If set, we build a release image.
        type: string
        required: false
        default: ''
      push: # false only builds the image (PR check)
        type: boolean
        required: false
        default: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/manifest-app
  TAG: ${{ inputs.release_tag || inputs.image_tag }}

jobs:
  # The Docker build runs dependency code (bun install, next build), so this job gets a
  # read-only token and no registry credentials. It hands the image to `push` as an OCI archive.
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build-time defaults. Current deployments do not pass NEXT_PUBLIC_* at container
      # start yet, so keep baking per-environment values until they all do (e.g. after the
      # move to Fred). Values passed at container start override these.
      - name: Create .env from environment vars/secrets
        if: inputs.environment != ''
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NEXT_PUBLIC_CHAIN: ${{ vars.NEXT_PUBLIC_CHAIN }}
          NEXT_PUBLIC_CHAIN_ID: ${{ vars.NEXT_PUBLIC_CHAIN_ID }}
          NEXT_PUBLIC_CHAIN_TIER: ${{ vars.NEXT_PUBLIC_CHAIN_TIER }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WALLETCONNECT_KEY: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_KEY }}
          NEXT_PUBLIC_WEB3AUTH_NETWORK: ${{ vars.NEXT_PUBLIC_WEB3AUTH_NETWORK }}
          NEXT_PUBLIC_WEB3AUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_WEB3AUTH_CLIENT_ID }}
          NEXT_PUBLIC_EXPLORER_URL: ${{ vars.NEXT_PUBLIC_EXPLORER_URL }}
          NEXT_PUBLIC_INDEXER_URL: ${{ vars.NEXT_PUBLIC_INDEXER_URL }}
          NEXT_PUBLIC_OSMOSIS_CHAIN: ${{ vars.NEXT_PUBLIC_OSMOSIS_CHAIN }}
          NEXT_PUBLIC_OSMOSIS_CHAIN_ID: ${{ vars.NEXT_PUBLIC_OSMOSIS_CHAIN_ID }}
          NEXT_PUBLIC_OSMOSIS_RPC_URL: ${{ vars.NEXT_PUBLIC_OSMOSIS_RPC_URL }}
          NEXT_PUBLIC_OSMOSIS_API_URL: ${{ vars.NEXT_PUBLIC_OSMOSIS_API_URL }}
          NEXT_PUBLIC_OSMOSIS_EXPLORER_URL: ${{ vars.NEXT_PUBLIC_OSMOSIS_EXPLORER_URL }}
          NEXT_PUBLIC_LEAP_DEEPLINK: ${{ vars.NEXT_PUBLIC_LEAP_DEEPLINK }}
          NEXT_PUBLIC_UPGRADE_MIN_BLOCK_OFFSET: ${{ vars.NEXT_PUBLIC_UPGRADE_MIN_BLOCK_OFFSET }}
          NEXT_PUBLIC_MFX_TO_PWR_CONVERSION_CONTRACT_ADDRESS: ${{ vars.NEXT_PUBLIC_MFX_TO_PWR_CONVERSION_CONTRACT_ADDRESS }}
        run: |
          # Fail rather than publish an image that is missing the values every page needs.
          for key in NEXT_PUBLIC_CHAIN NEXT_PUBLIC_CHAIN_ID NEXT_PUBLIC_CHAIN_TIER NEXT_PUBLIC_RPC_URL \
            NEXT_PUBLIC_API_URL NEXT_PUBLIC_WALLETCONNECT_KEY NEXT_PUBLIC_WEB3AUTH_CLIENT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is empty in the $ENVIRONMENT environment"
              exit 1
            fi
          done
          env | grep '^NEXT_PUBLIC_' | sort > .env

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.TAG }}

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # PR builds only read the cache.
          cache-to: ${{ inputs.push && 'type=gha,mode=max' || '' }}
          provenance: mode=max
          sbom: true

      - name: Upload image
        if: inputs.push
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1
          # The layers are already compressed.
          compression-level: 0

  # Pushes and attests the image built above. It runs no repository code, so the registry
  # credentials and the signing identity never share a job with the build. Its permissions
  # come from the calling job in docker.yml: declaring them here would make GitHub require
  # them from the PR build too, even though that build skips this job.
  push:
    needs: build
    if: inputs.push
    runs-on: ubuntu-24.04 # ships skopeo

    steps:
      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --all and --preserve-digests push the image index exactly as built, with the buildx
      # SBOM and provenance, so the pushed digest is the one attested below.
      - name: Push
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          skopeo copy --all --preserve-digests \
            --dest-authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
            --digestfile "$RUNNER_TEMP/pushed-digest" \
            "oci-archive:$RUNNER_TEMP/image.tar" "docker://$IMAGE:$TAG"
          pushed=$(cat "$RUNNER_TEMP/pushed-digest")
          if [ "$pushed" != "$DIGEST" ]; then
            echo "::error::Pushed $pushed, but the build produced $DIGEST"
            exit 1
          fi

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          # A storage record would also need the artifact-metadata: write permission.
          create-storage-record: false
