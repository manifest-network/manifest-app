name: Docker (GHCR)

on:
  push:
    branches:
      - release/qa
      - release/testnet
      - release/mainnet
    tags:
      - 'v*.*.*' # release tags
  # Build without publishing when a PR changes what goes into the image, so a broken image
  # shows up before it reaches a release branch.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.mjs
      - next.config.mjs
      - package.json
      - bun.lock
      - scripts/update-version.js
      - .github/workflows/docker.yml
      - .github/workflows/_docker-build.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# The publishing jobs grant what _docker-build.yml's push job needs, and pass
# `secrets: inherit`. The build's environment secrets (NEXT_PUBLIC_WALLETCONNECT_KEY,
# NEXT_PUBLIC_WEB3AUTH_CLIENT_ID) only reach a reusable workflow that way, even though its
# job names the environment (actions/runner#4453). The repository secrets that come along
# are not referenced there. PR builds get no secrets.
jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_docker-build.yml
    permissions:
      contents: read
    with:
      image_tag: pr
      push: false

  qa:
    if: github.ref == 'refs/heads/release/qa'
    uses: ./.github/workflows/_docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      environment: qa
      image_tag: qa
    secrets: inherit # zizmor: ignore[secrets-inherit] see the comment above jobs

  testnet:
    if: github.ref == 'refs/heads/release/testnet'
    uses: ./.github/workflows/_docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      environment: testnet
      image_tag: testnet
    secrets: inherit # zizmor: ignore[secrets-inherit] see the comment above jobs

  mainnet:
    if: github.ref == 'refs/heads/release/mainnet'
    uses: ./.github/workflows/_docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      environment: mainnet
      image_tag: mainnet
    secrets: inherit # zizmor: ignore[secrets-inherit] see the comment above jobs

  release_tag:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/_docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      environment: mainnet
      image_tag: mainnet
      release_tag: ${{ github.ref_name }} # e.g., v1.2.3
    secrets: inherit # zizmor: ignore[secrets-inherit] see the comment above jobs
