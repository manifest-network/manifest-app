name: Build
permissions:
  contents: read

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Bun
        uses: oven-sh/setup-bun@v1
        with:
          # Pinned: Bun 1.4 breaks the test suite ('TypeError: Invalid URL' from happy-dom).
          # Keep all workflows on the same version.
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
