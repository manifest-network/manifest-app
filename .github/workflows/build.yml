name: Build
permissions:
  contents: read

on:
  # PR branches are covered by the pull_request run. A push run there would add a second
  # check with the same name to the PR.
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: Bun 1.4 breaks the test suite ('TypeError: Invalid URL' from happy-dom).
          # Keep all workflows on the same version.
          bun-version: 1.3.14
          # No Actions cache for the Bun binary, so a cache entry can never stand in for it.
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
