version: 2
updates:
  # cooldown holds version updates for a week after a release, so a compromised release has
  # time to be pulled first. Security updates are not delayed.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    # CI pins Bun 1.3.14 because Bun 1.4 breaks the test suite; the image stays on the same
    # minor. Drop this together with the bun-version pins in the workflows.
    ignore:
      - dependency-name: 'oven/bun'
        versions: ['>= 1.4.0']

  # Workflows pin actions by commit SHA; this keeps the pins and their version comments current.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
