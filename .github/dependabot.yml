version: 2
updates:
  # cooldown holds version updates for a week after a release, so a compromised release has
  # time to be pulled first. Security updates are not delayed.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  # Workflows pin actions by commit SHA; this keeps the pins and their version comments current.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
