version: 2
updates:
  # cooldown holds version updates for a week after a release, so a compromised release has
  # time to be pulled first. Security updates are not delayed.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
    # At the default limit of 5, a handful of PRs left open stops all new version updates.
    open-pull-requests-limit: 10
    # Packages that must move in lockstep: the devtools peer-depend on the same react-query
    # version, eslint-config-next tracks next, react and react-dom must be the exact same
    # version, and @tailwindcss/postcss (which compiles the CSS) pins its own tailwindcss.
    groups:
      tanstack-query:
        patterns: ['@tanstack/react-query', '@tanstack/react-query-devtools']
      next:
        patterns: ['next', 'eslint-config-next']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/postcss']
    # next 16 is a deliberate hold: it fails the build and needs its own migration.
    ignore:
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      # eslint 10 drops eslintrc, and Next 15's build-time lint still passes eslintrc options, so
      # linting silently stops. It moves with the next 16 migration.
      - dependency-name: 'eslint'
        versions: ['>= 10.0.0']
      # @cosmjs/stargate is the Manifest fork of 0.32, so the rest of cosmjs stays on 0.32 with it.
      # cosmjs minors are breaking.
      - dependency-name: '@cosmjs/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # cosmjs 0.32 is built on cosmjs-types 0.9; the app's direct imports move with it.
      - dependency-name: 'cosmjs-types'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # chain-registry 2 is built for interchain-kit (@chain-registry/types 2), while cosmos-kit 2
      # uses the 0.x types. It moves with a cosmos-kit to interchain-kit migration.
      - dependency-name: 'chain-registry'
        update-types: ['version-update:semver-major']
      # Next 15 type-checks through the TypeScript JavaScript compiler API, which TypeScript 7's
      # native compiler doesn't provide. TypeScript 6 is still fine.
      - dependency-name: 'typescript'
        versions: ['>= 7.0.0']
      # happy-dom 21 slows three form tests past Bun's 5 s timeout, but only after
      # sendBox.test.tsx has run: state it leaves in the shared test document (Web3Auth's modal
      # stylesheet, interchain-ui's overlay root) costs far more under 21. Needs test isolation
      # first.
      - dependency-name: '@happy-dom/global-registrator'
        versions: ['>= 21.0.0']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    # CI pins Bun 1.3.14 because Bun 1.4 breaks the test suite; the image stays on the same
    # minor. Drop this together with the bun-version pins in the workflows.
    ignore:
      - dependency-name: 'oven/bun'
        versions: ['>= 1.4.0']

  # Workflows pin actions by commit SHA; this keeps the pins and their version comments current.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
