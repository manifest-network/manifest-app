queue_rules:
  - name: default
    # What must be true to enter the queue
    queue_conditions:
      - check-success=build
      - check-success=prettier
      - check-success=test
      - -conflict
    # What must be true to merge once at queue head
    merge_conditions:
      - check-success=build
      - check-success=prettier
      - check-success=test
    merge_method: squash

pull_request_rules:
  # 1) Auto-promote everything merged on main → QA
  - name: backport merged PRs on main to release/qa
    conditions:
      - base = main
      - merged
    actions:
      backport:
        branches:
          - release/qa
        labels:
          - from:main

  - name: auto-merge backport into release/qa
    conditions:
      - base = release/qa
      - author = mergify[bot]
      - -draft
      - -conflict
    actions:
      queue:
        name: default

  # 2) Manual promote from the *main PR* directly to testnet
  - name: backport merged main to testnet when labeled
    conditions:
      - base = main
      - merged
      - label = promote:testnet
    actions:
      backport:
        branches: [release/testnet]
        labels:
          - from:main

  - name: auto-merge created backport into release/testnet
    conditions:
      - base = release/testnet
      - author = mergify[bot]
      - -draft
      - -conflict
    actions:
      queue:
        name: default

  # 3) Manual promote from the *main PR* directly to mainnet
  - name: backport merged main to mainnet when labeled
    conditions:
      - base = main
      - merged
      - label = promote:mainnet
    actions:
      backport:
        branches: [release/mainnet]
        labels:
          - from:main

  - name: auto-merge created backport into release/mainnet
    conditions:
      - base = release/mainnet
      - author = mergify[bot]
      - -draft
      - -conflict
    actions:
      queue:
        name: default

# Release branches need no approval, and only Mergify can merge into them. So the commands that
# can put code there are limited to admins: `copy` works on unmerged PRs, and the rules above
# auto-merge any release PR Mergify authors. Everyone else promotes with the promote:* labels,
# which only backport merged, reviewed PRs from main.
commands_restrictions:
  copy:
    conditions:
      - sender-permission >= admin
  backport:
    conditions:
      - sender-permission >= admin
  queue:
    conditions:
      - sender-permission >= admin
  requeue:
    conditions:
      - sender-permission >= admin
